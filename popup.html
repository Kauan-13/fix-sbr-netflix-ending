<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>SBR Ending Fixer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            width: 240px;
            padding: 15px;
            background-color: #141414;
            color: #ffffff;
            margin: 0;
        }
        header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }
        img {
            width: 48px;
            height: 48px;
            margin-right: 10px;
        }
        h2 {
            font-size: 16px;
            color: #E50914;
            text-align: center;
        }
        .section {
            margin-bottom: 10px;
        }
        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #222;
            padding: 10px;
            border-radius: 4px;
        }
        .status {
            font-size: 12px;
            margin-top: 8px;
            text-align: center;
            color: #aaa;
        }
        .info {
            font-size: 11px;
            color: #888;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <header>
        <img src="./icon.png" alt="">
        <h2>Steel Ball Run Fixer</h2>
    </header>

    <div class="section toggle-container">
        <span>Ativar Extensão</span>
        <input type="checkbox" id="enabledToggle">
    </div>

    <script src="popup.js"></script>
</body>
</html>
